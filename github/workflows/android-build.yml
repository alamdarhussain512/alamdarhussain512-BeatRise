name: Build Android APK 🎮

on:
  workflow_dispatch: # Yeh aapko manually build start karne ka button dega

jobs:
  build:
    name: Build APK for Android
    runs-on: ubuntu-latest
    steps:
      # 1. Repository se aapka 56 files wala code uthayega
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Unity GameCI ke zariye aapki game ka APK banayega
      - name: Build Unity Android Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: BeatRise_TestBuild

      # 3. APK banne ke baad aapko download karne ke liye link dega
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatRise-Android-APK
          path: build/Android
          
